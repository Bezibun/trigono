<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
    tailwind.config = {
        darkMode: 'class',
    }
    </script>



    
  </head>
  <body>
    
       <nav
      class="fixed top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-4xl bg-white/70 dark:bg-gray-900/70 backdrop-blur-md rounded-full shadow-lg flex items-center justify-between px-5 py-2 transition-all duration-500"
    >
      <!-- Kiri: Logo + Judul -->
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 bg-blue-600 flex items-center justify-center rounded-full">
          <i class="bx bx-plus text-white text-lg"></i>
        </div>
        <h1
          class="text-sm sm:text-base font-semibold text-gray-800 dark:text-gray-100"
        >
          Modul Trigonometri
        </h1>
      </div>

      <!-- Kanan: Tombol -->
      <div class="flex items-center space-x-2">
        <!-- Tombol Kembali -->
        <button
          onclick="window.history.back()"
          class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-blue-700 dark:text-gray-300 transition"
        >
          <i class="bx bx-arrow-back text-lg"></i>
        </button>

        <!-- Toggle Darkmode -->
        <button
          id="darkToggle"
          class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-600 hover:bg-blue-500 dark:bg-gray-800 dark:hover:bg-gray-700 text-white dark:text-gray-300 transition"
        >
          <i class="bx bx-moon text-lg"></i>
        </button>
      </div>
    </nav>
 
    
    
    
    
    <section
      id="simulasiPesawat"
      class="flex items-center justify-center min-h-screen w-full bg-gradient-to-br from-sky-50 via-white to-blue-100 dark:from-gray-800 dark:to-gray-900 mt-16"
    >
      <div
        class="w-full max-w-6xl bg-white dark:bg-gray-900 rounded-3xl p-6 sm:p-8 overflow-auto flex flex-col shadow-xl mt-16 mb-16"
      >
        <h2
          class="text-3xl sm:text-4xl font-extrabold text-center mb-6 tracking-tight flex items-center justify-center gap-2 text-sky-700 dark:text-sky-300"
        >
          <i class="bx bx-plane-alt text-3xl sm:text-4xl"></i>
          Simulasi Sudut Elevasi Pesawat Terbang
        </h2>

        <!-- AREA SIMULASI -->
        <div
          class="relative w-full aspect-[2/1] rounded-2xl overflow-hidden border border-sky-200 dark:border-gray-700 shadow-md bg-gradient-to-b from-sky-100 to-white p-2 sm:p-4"
        >
          <svg
            id="planeCanvas"
            viewBox="0 0 600 300"
            preserveAspectRatio="xMidYMid meet"
            class="w-full h-full"
          >
            <!-- Tanah -->
            <rect x="0" y="260" width="600" height="40" fill="#a7f3d0"></rect>

            <!-- Pengamat -->
            <g id="observer" transform="translate(80,250)">
              <circle cx="0" cy="0" r="10" fill="#1E3A8A"></circle>
              <rect
                x="-4"
                y="0"
                width="8"
                height="20"
                rx="3"
                fill="#2563EB"
              ></rect>
            </g>

            <!-- Pesawat -->
            <!-- Pesawat -->
            <g id="plane" transform="translate(400,150)">
                <!-- Badan pesawat -->
                <rect x="0" y="4" width="40" height="8" fill="#2563EB" rx="3"></rect>
                
                <!-- Hidung pesawat -->
                <path d="M40,4 Q47,8 40,12 Z" fill="#2563EB"></path>
                
                <!-- Sayap atas -->
                <polygon points="15,4 25,-6 28,-6 18,4" fill="#3b82f6"></polygon>
                
                <!-- Sayap bawah -->
                <polygon points="15,12 25,22 28,22 18,12" fill="#3b82f6"></polygon>
                
                <!-- Ekor vertikal -->
                <polygon points="0,4 0,12 -6,8" fill="#1e40af"></polygon>
            </g>


            <!-- Garis pandang -->
            <line
              id="viewLinePlane"
              x1="80"
              y1="250"
              x2="430"
              y2="150"
              stroke="#38BDF8"
              stroke-width="2"
              stroke-dasharray="6,4"
            />

            <!-- Sudut -->
            <text id="anglePlaneText" x="100" y="230" fill="#000">θ = 0°</text>
          </svg>
        </div>

        <!-- SLIDER KONTROL -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mt-6">
          <!-- Slider Horizontal -->
          <div
            class="p-4 bg-white/90 dark:bg-gray-700/50 rounded-2xl shadow-md border border-sky-100 dark:border-gray-600"
          >
            <label
              class="block font-semibold mb-2 flex items-center gap-2 text-sky-800 dark:text-sky-200 text-sm sm:text-base"
            >
              <i class="bx bx-right-arrow-alt text-sky-600 text-xl"></i> Jarak
              Horizontal (m)
            </label>
            <input
              id="horizontalSlider"
              type="range"
              min="50"
              max="400"
              value="300"
              step="5"
              class="w-full accent-sky-600"
            />
            <p class="text-sm mt-1 text-gray-600 dark:text-gray-300">
              Jarak: <span id="horizontalValue">300</span> m
            </p>
          </div>

          <!-- Slider Vertikal -->
          <div
            class="p-4 bg-white/90 dark:bg-gray-700/50 rounded-2xl shadow-md border border-sky-100 dark:border-gray-600"
          >
            <label
              class="block font-semibold mb-2 flex items-center gap-2 text-sky-800 dark:text-sky-200 text-sm sm:text-base"
            >
              <i class="bx bx-up-arrow-alt text-sky-600 text-xl"></i> Ketinggian
              Pesawat (m)
            </label>
            <input
              id="verticalSlider"
              type="range"
              min="10"
              max="200"
              value="100"
              step="5"
              class="w-full accent-sky-600"
            />
            <p class="text-sm mt-1 text-gray-600 dark:text-gray-300">
              Tinggi: <span id="verticalValue">100</span> m
            </p>
          </div>
        </div>

        <!-- HASIL RUMUS -->
        <div
          class="mt-6 bg-white/90 dark:bg-gray-700/50 border border-sky-100 dark:border-gray-600 rounded-2xl shadow-inner p-5 text-gray-800 dark:text-gray-200 text-sm sm:text-base"
        >
          <div class="flex items-center justify-center gap-2 mb-3">
            <i class="bx bx-calculator text-2xl text-sky-600"></i>
            <p class="font-bold text-lg text-sky-800 dark:text-sky-200">
              Perhitungan Sudut Elevasi (cos)
            </p>
          </div>
          <p
            id="formulaPlaneText"
            class="text-center text-base md:text-lg leading-relaxed font-medium text-gray-700 dark:text-gray-300"
          >
            cos(θ) = horizontal / miring = 0 / 0 = 0 → θ = 0°
          </p>

          <div class="mt-4 flex justify-center">
            <div
              class="bg-sky-100 dark:bg-sky-900 text-sky-800 dark:text-sky-200 px-6 py-2 rounded-xl text-lg font-bold shadow"
            >
              θ = <span id="anglePlaneResult">0°</span>
            </div>
          </div>
        </div>
      </div>
    </section>





<!-- ===== SECTION: KUIS REFLEKTIF SUDUT ELEVASI ===== -->
<section id="quiz-section" class="bg-gradient-to-b from-blue-50 to-white dark:from-gray-900 dark:to-gray-800 text-gray-800 dark:text-gray-100 py-12 px-4 transition-colors duration-300">
  <div class="bg-white dark:bg-gray-900 shadow-xl rounded-2xl w-full max-w-2xl mx-auto p-8 text-center transition-colors duration-300">
    <h1 class="text-3xl font-bold mb-4 text-blue-600 dark:text-blue-400">Kuis Reflektif Sudut Elevasi</h1>

    <div id="quiz-container" class="space-y-6">
      <!-- Progress Bar -->
      <div id="progress-bar" class="w-full bg-gray-200 dark:bg-gray-700 h-3 rounded-full">
        <div id="progress" class="h-3 bg-blue-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
      </div>

      <!-- Pertanyaan dan Opsi -->
      <div id="question-container" class="mt-6">
        <h2 id="question" class="text-lg font-semibold mb-4"></h2>
        <div id="options" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

      <!-- Tombol Next -->
      <button id="next-btn" class="mt-6 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium disabled:opacity-50 transition-colors duration-300">
        Soal Selanjutnya
      </button>

      <!-- Hasil Akhir -->
      <div id="result" class="hidden mt-8"></div>
    </div>
  </div>

  <script>
    const quizData = [
  {
    question: "Seorang pengamat melihat pesawat dengan sudut elevasi 45°. Jika pesawat naik lebih tinggi tanpa mengubah posisi horizontalnya, maka sudut elevasi akan ...",
    options: [
      "Semakin besar",
      "Semakin kecil",
      "Tetap sama",
      "Menjadi 0°"
    ],
    correct: 0
  },
  {
    question: "Ketika pesawat menjauh secara horizontal dari pengamat di tanah, sudut elevasi akan ...",
    options: [
      "Semakin besar",
      "Semakin kecil",
      "Tetap sama",
      "Tidak dapat ditentukan"
    ],
    correct: 1
  },
  {
    question: "Jika pengamat mengetahui tinggi pesawat dan sudut elevasi, maka jarak horizontal ke pesawat dapat ditentukan dengan rumus ...",
    options: [
      "tan θ = tinggi / jarak horizontal",
      "sin θ = jarak horizontal / tinggi",
      "cos θ = tinggi / sisi miring",
      "tan θ = jarak horizontal / tinggi"
    ],
    correct: 0
  },
  {
    question: "Pesawat terlihat dari dua titik berbeda di tanah dengan sudut elevasi 30° dan 60°. Titik dengan sudut elevasi 60° berarti ...",
    options: [
      "Lebih jauh dari pesawat",
      "Lebih dekat ke pesawat",
      "Pesawat lebih rendah",
      "Tidak dapat dibandingkan"
    ],
    correct: 1
  },
  {
    question: "Sisi miring dalam segitiga pengamatan pesawat menunjukkan ...",
    options: [
      "Jarak horizontal pesawat",
      "Jarak sebenarnya antara pengamat dan pesawat",
      "Tinggi pesawat dari tanah",
      "Bayangan pesawat di tanah"
    ],
    correct: 1
  }
];

    let currentQuestion = 0;
    let score = 0;
    const totalQuestions = quizData.length;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const resultEl = document.getElementById("result");
    const progressEl = document.getElementById("progress");

    function loadQuestion() {
      const currentQuiz = quizData[currentQuestion];
      questionEl.textContent = `${currentQuestion + 1}. ${currentQuiz.question}`;
      optionsEl.innerHTML = "";
      currentQuiz.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.className = "border border-blue-500 dark:border-blue-400 rounded-xl px-4 py-2 hover:bg-blue-100 dark:hover:bg-gray-700 transition-colors duration-200";
        btn.onclick = () => selectAnswer(i, btn);
        optionsEl.appendChild(btn);
      });
      nextBtn.disabled = true;
      updateProgress();
    }

    function selectAnswer(i, btn) {
      const correct = quizData[currentQuestion].correct;
      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);

      if (i === correct) {
        btn.classList.add("bg-green-500", "text-white", "border-0");
        score++;
      } else {
        btn.classList.add("bg-red-500", "text-white", "border-0");
        buttons[correct].classList.add("bg-green-500", "text-white", "border-0");
      }
      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < totalQuestions) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      questionEl.classList.add("hidden");
      optionsEl.classList.add("hidden");
      nextBtn.classList.add("hidden");
      progressEl.style.width = "100%";
      const percentage = Math.round((score / totalQuestions) * 100);

      resultEl.innerHTML = `
        <div class="flex flex-col items-center justify-center animate-fadeIn">
          <div class="relative w-32 h-32 mb-4">
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
              <circle cx="64" cy="64" r="58" stroke="gray" stroke-width="8" fill="none" class="opacity-30" />
              <circle cx="64" cy="64" r="58" stroke="#3B82F6" stroke-width="8" fill="none" stroke-dasharray="364" stroke-dashoffset="${364 - (364 * percentage / 100)}" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center text-2xl font-bold text-blue-600 dark:text-blue-400">
              ${percentage}%
            </div>
          </div>
          <h2 class="text-2xl font-semibold mb-2 text-blue-600 dark:text-blue-400">Hasil Akhir</h2>
          <p class="text-lg mb-4">Kamu menjawab <strong>${score}</strong> dari <strong>${totalQuestions}</strong> soal dengan benar.</p>
          <button id="retry-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition-colors duration-300">
            Ulangi Quiz
          </button>
        </div>
      `;
      resultEl.classList.remove("hidden");
      document.getElementById("retry-btn").addEventListener("click", restartQuiz);
    }

    function updateProgress() {
      const progress = ((currentQuestion) / totalQuestions) * 100;
      progressEl.style.width = `${progress}%`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      resultEl.classList.add("hidden");
      questionEl.classList.remove("hidden");
      optionsEl.classList.remove("hidden");
      nextBtn.classList.remove("hidden");
      loadQuestion();
    }

    nextBtn.addEventListener("click", nextQuestion);
    loadQuestion();
  </script>
</section>












    <script>
      const plane = document.getElementById("plane");
      const observer = document.getElementById("observer");
      const viewLinePlane = document.getElementById("viewLinePlane");
      const anglePlaneText = document.getElementById("anglePlaneText");
      const horizontalSlider = document.getElementById("horizontalSlider");
      const verticalSlider = document.getElementById("verticalSlider");
      const horizontalValue = document.getElementById("horizontalValue");
      const verticalValue = document.getElementById("verticalValue");
      const formulaPlaneText = document.getElementById("formulaPlaneText");
      const anglePlaneResult = document.getElementById("anglePlaneResult");

      function updatePlaneSim() {
        const horizontal = parseFloat(horizontalSlider.value);
        const vertical = parseFloat(verticalSlider.value);

        horizontalValue.textContent = horizontal.toFixed(1);
        verticalValue.textContent = vertical.toFixed(1);

        // Posisi pesawat
        const planeX = 80 + horizontal;
        const planeY = 250 - vertical * 0.8;
        plane.setAttribute("transform", `translate(${planeX}, ${planeY})`);

        // Update garis pandang
        viewLinePlane.setAttribute("x2", planeX);
        viewLinePlane.setAttribute("y2", planeY);

        // Hitung sudut menggunakan cos
        const miring = Math.sqrt(horizontal ** 2 + vertical ** 2);
        const cosTheta = horizontal / miring;
        const rad = Math.acos(cosTheta);
        const deg = ((rad * 180) / Math.PI).toFixed(2);
        const cosVal = cosTheta.toFixed(3);

        // Update teks
        anglePlaneText.textContent = `θ = ${deg}°`;
        anglePlaneText.setAttribute("x", 100);
        anglePlaneText.setAttribute("y", 230);

        formulaPlaneText.innerHTML = `
      cos(θ) = <span class="text-sky-700 font-semibold dark:text-sky-300">${horizontal}</span> /
      <span class="text-sky-700 font-semibold dark:text-sky-300">${miring.toFixed(
        2
      )}</span> =
      <span class="text-rose-600 font-semibold">${cosVal}</span>
      → θ = <span class="font-bold text-sky-700 dark:text-sky-300">${deg}°</span>
    `;

        anglePlaneResult.textContent = `${deg}°`;
      }

      horizontalSlider.addEventListener("input", updatePlaneSim);
      verticalSlider.addEventListener("input", updatePlaneSim);
      updatePlaneSim();
    </script>

    

      <!-- Script Dark Mode -->
    <script>
      const darkToggle = document.getElementById("darkToggle");
      const html = document.documentElement;

      // Atur tema awal
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        html.classList.add("dark");
        darkToggle.innerHTML = "<i class='bx bx-sun text-lg'></i>";
      } else {
        html.classList.remove("dark");
        darkToggle.innerHTML = "<i class='bx bx-moon text-lg'></i>";
      }

      // Saat tombol diklik
      darkToggle.addEventListener("click", () => {
        html.classList.toggle("dark");
        if (html.classList.contains("dark")) {
          localStorage.theme = "dark";
          darkToggle.innerHTML = "<i class='bx bx-sun text-lg'></i>";
        } else {
          localStorage.theme = "light";
          darkToggle.innerHTML = "<i class='bx bx-moon text-lg'></i>";
        }
      });
    </script>






  </body>
</html>
