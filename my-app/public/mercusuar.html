<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Sudut Elevasi Mercusuar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <script>
    tailwind.config = {
        darkMode: 'class',
    }
    </script>


    
  </head>
  <body class="bg-gradient-to-br from-sky-50 via-white to-blue-100 dark:from-gray-800 dark:to-gray-900">

    <nav
      class="fixed top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-4xl bg-white/70 dark:bg-gray-900/70 backdrop-blur-md rounded-full shadow-lg flex items-center justify-between px-5 py-2 transition-all duration-500"
    >
      <!-- Kiri: Logo + Judul -->
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 bg-blue-600 flex items-center justify-center rounded-full">
          <i class="bx bx-plus text-white text-lg"></i>
        </div>
        <h1
          class="text-sm sm:text-base font-semibold text-gray-800 dark:text-gray-100"
        >
          Modul Trigonometri
        </h1>
      </div>

      <!-- Kanan: Tombol -->
      <div class="flex items-center space-x-2">
        <!-- Tombol Kembali -->
        <button
          onclick="window.history.back()"
          class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-blue-700 dark:text-gray-300 transition"
        >
          <i class="bx bx-arrow-back text-lg"></i>
        </button>

        <!-- Toggle Darkmode -->
        <button
          id="darkToggle"
          class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-600 hover:bg-blue-500 dark:bg-gray-800 dark:hover:bg-gray-700 text-white dark:text-gray-300 transition"
        >
          <i class="bx bx-moon text-lg"></i>
        </button>
      </div>
    </nav>


    
    

    <section id="simulasiMercusuar" class="flex items-center justify-center min-h-screen w-full p-6 mt-16">
      <div class="w-full max-w-6xl bg-white dark:bg-gray-900 rounded-3xl p-6 sm:p-8 overflow-auto shadow-xl">
        <h2 class="text-3xl sm:text-4xl font-extrabold text-center mb-6 tracking-tight flex items-center justify-center gap-2 text-sky-700 dark:text-sky-300">
          <i class="bx bx-building text-3xl sm:text-4xl"></i>
          Simulasi Sudut Elevasi Mercusuar
        </h2>

        <!-- AREA SIMULASI -->
        <div class="relative w-full aspect-[2/1] rounded-2xl overflow-hidden border border-sky-200 dark:border-gray-700 shadow-md bg-gradient-to-b from-sky-100 to-white p-2 sm:p-4">
          <svg id="lighthouseCanvas" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet" class="w-full h-full">
            
            <!-- Laut -->
            <rect x="0" y="260" width="600" height="40" fill="#93c5fd"></rect>

            <!-- Mercusuar -->
            <g id="lighthouse" transform="translate(520,160)">
              <rect x="-15" y="0" width="30" height="100" fill="#f87171" stroke="#7f1d1d" stroke-width="1.5"></rect>
              <rect x="-20" y="-20" width="40" height="20" fill="#fb923c" stroke="#7f1d1d" stroke-width="1.5"></rect>
              <polygon points="-20,-20 0,-40 20,-20" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"></polygon>
              <circle cx="0" cy="-30" r="4" fill="#fde68a"></circle>
            </g>

            <!-- Kapal -->
            <g id="ship" transform="translate(100,250)">
              <polygon points="0,0 60,0 50,15 10,15" fill="#1e40af"></polygon>
              <rect x="15" y="-15" width="20" height="15" fill="#3b82f6"></rect>
              <polygon points="25,-15 25,-45 30,-15" fill="#60a5fa"></polygon>
            </g>

            <!-- Garis pandang -->
            <line id="viewLine" x1="130" y1="250" x2="520" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"></line>

            <!-- Sudut -->
            <text id="angleText" x="150" y="230" fill="#000" font-size="14">θ = 0°</text>
          </svg>
        </div>

        <!-- SLIDER -->
        <div class="mt-6 p-4 bg-white/90 dark:bg-gray-700/50 rounded-2xl shadow-md border border-sky-100 dark:border-gray-600">
          <label class="block font-semibold mb-2 flex items-center gap-2 text-sky-800 dark:text-sky-200 text-sm sm:text-base">
            <i class="bx bx-left-arrow-alt text-sky-600 text-xl"></i> Jarak Kapal ke Mercusuar (m)
          </label>
          <input id="shipSlider" type="range" min="100" max="500" value="400" step="5" class="w-full accent-sky-600" />
          <p class="text-sm mt-1 text-gray-600 dark:text-gray-300">Jarak: <span id="shipValue">400</span> m</p>
        </div>

        <!-- HASIL RUMUS -->
        <div class="mt-6 bg-white/90 dark:bg-gray-700/50 border border-sky-100 dark:border-gray-600 rounded-2xl shadow-inner p-5 text-gray-800 dark:text-gray-200 text-sm sm:text-base">
          <div class="flex items-center justify-center gap-2 mb-3">
            <i class="bx bx-calculator text-2xl text-sky-600"></i>
            <p class="font-bold text-lg text-sky-800 dark:text-sky-200">
              Perhitungan Sudut Elevasi (sin)
            </p>
          </div>

          <p id="formulaText" class="text-center text-base md:text-lg leading-relaxed font-medium text-gray-700 dark:text-gray-300">
            sin(θ) = tinggi / miring = 0 / 0 = 0 → θ = 0°
          </p>

          <div class="mt-4 flex justify-center">
            <div class="bg-sky-100 dark:bg-sky-900 text-sky-800 dark:text-sky-200 px-6 py-2 rounded-xl text-lg font-bold shadow">
              θ = <span id="angleResult">0°</span>
            </div>
          </div>
        </div>
      </div>
    </section>




<!-- ===== SECTION: KUIS REFLEKTIF SUDUT ELEVASI ===== -->
<section id="quiz-section" class="bg-gradient-to-b from-blue-50 to-white dark:from-gray-900 dark:to-gray-800 text-gray-800 dark:text-gray-100 py-12 px-4 transition-colors duration-300">
  <div class="bg-white dark:bg-gray-900 shadow-xl rounded-2xl w-full max-w-2xl mx-auto p-8 text-center transition-colors duration-300">
    <h1 class="text-3xl font-bold mb-4 text-blue-600 dark:text-blue-400">Kuis Reflektif Sudut Elevasi</h1>

    <div id="quiz-container" class="space-y-6">
      <!-- Progress Bar -->
      <div id="progress-bar" class="w-full bg-gray-200 dark:bg-gray-700 h-3 rounded-full">
        <div id="progress" class="h-3 bg-blue-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
      </div>

      <!-- Pertanyaan dan Opsi -->
      <div id="question-container" class="mt-6">
        <h2 id="question" class="text-lg font-semibold mb-4"></h2>
        <div id="options" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

      <!-- Tombol Next -->
      <button id="next-btn" class="mt-6 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium disabled:opacity-50 transition-colors duration-300">
        Soal Selanjutnya
      </button>

      <!-- Hasil Akhir -->
      <div id="result" class="hidden mt-8"></div>
    </div>
  </div>

  <script>
    const quizData = [
  {
    question: "Seorang pelaut melihat puncak mercusuar dengan sudut elevasi 20°. Jika kapal mendekat ke pantai, maka sudut elevasi akan ...",
    options: [
      "Semakin besar",
      "Semakin kecil",
      "Tetap sama",
      "Tidak berpengaruh"
    ],
    correct: 0
  },
  {
    question: "Jika tinggi mercusuar tetap, tetapi kapal menjauh dua kali lipat dari posisi awal, maka sudut elevasi akan menjadi ...",
    options: [
      "Dua kali lebih besar",
      "Setengah dari sudut awal",
      "Sama besar",
      "Tidak dapat dihitung"
    ],
    correct: 1
  },
  {
    question: "Ketika pelaut mengetahui tinggi mercusuar dan sudut elevasi, maka jarak kapal dari mercusuar dapat dicari dengan ...",
    options: [
      "tan θ = tinggi mercusuar / jarak kapal",
      "tan θ = jarak kapal / tinggi mercusuar",
      "cos θ = tinggi mercusuar / sisi miring",
      "sin θ = tinggi mercusuar / sisi miring"
    ],
    correct: 0
  },
  {
    question: "Jika sudut elevasi mercusuar berubah dari 15° menjadi 45°, maka kapal ...",
    options: [
      "Menjauh dari mercusuar",
      "Mendekat ke mercusuar",
      "Tinggi mercusuar berkurang",
      "Berada tepat di bawah mercusuar"
    ],
    correct: 1
  },
  {
    question: "Dalam segitiga pengamatan kapal terhadap mercusuar, sisi miring menggambarkan ...",
    options: [
      "Jarak horizontal antara kapal dan mercusuar",
      "Garis pandang dari kapal ke puncak mercusuar",
      "Tinggi mercusuar dari permukaan laut",
      "Arah angin laut"
    ],
    correct: 1
  }
];

    let currentQuestion = 0;
    let score = 0;
    const totalQuestions = quizData.length;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const resultEl = document.getElementById("result");
    const progressEl = document.getElementById("progress");

    function loadQuestion() {
      const currentQuiz = quizData[currentQuestion];
      questionEl.textContent = `${currentQuestion + 1}. ${currentQuiz.question}`;
      optionsEl.innerHTML = "";
      currentQuiz.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.className = "border border-blue-500 dark:border-blue-400 rounded-xl px-4 py-2 hover:bg-blue-100 dark:hover:bg-gray-700 transition-colors duration-200";
        btn.onclick = () => selectAnswer(i, btn);
        optionsEl.appendChild(btn);
      });
      nextBtn.disabled = true;
      updateProgress();
    }

    function selectAnswer(i, btn) {
      const correct = quizData[currentQuestion].correct;
      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);

      if (i === correct) {
        btn.classList.add("bg-green-500", "text-white", "border-0");
        score++;
      } else {
        btn.classList.add("bg-red-500", "text-white", "border-0");
        buttons[correct].classList.add("bg-green-500", "text-white", "border-0");
      }
      nextBtn.disabled = false;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < totalQuestions) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      questionEl.classList.add("hidden");
      optionsEl.classList.add("hidden");
      nextBtn.classList.add("hidden");
      progressEl.style.width = "100%";
      const percentage = Math.round((score / totalQuestions) * 100);

      resultEl.innerHTML = `
        <div class="flex flex-col items-center justify-center animate-fadeIn">
          <div class="relative w-32 h-32 mb-4">
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
              <circle cx="64" cy="64" r="58" stroke="gray" stroke-width="8" fill="none" class="opacity-30" />
              <circle cx="64" cy="64" r="58" stroke="#3B82F6" stroke-width="8" fill="none" stroke-dasharray="364" stroke-dashoffset="${364 - (364 * percentage / 100)}" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center text-2xl font-bold text-blue-600 dark:text-blue-400">
              ${percentage}%
            </div>
          </div>
          <h2 class="text-2xl font-semibold mb-2 text-blue-600 dark:text-blue-400">Hasil Akhir</h2>
          <p class="text-lg mb-4">Kamu menjawab <strong>${score}</strong> dari <strong>${totalQuestions}</strong> soal dengan benar.</p>
          <button id="retry-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition-colors duration-300">
            Ulangi Quiz
          </button>
        </div>
      `;
      resultEl.classList.remove("hidden");
      document.getElementById("retry-btn").addEventListener("click", restartQuiz);
    }

    function updateProgress() {
      const progress = ((currentQuestion) / totalQuestions) * 100;
      progressEl.style.width = `${progress}%`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      resultEl.classList.add("hidden");
      questionEl.classList.remove("hidden");
      optionsEl.classList.remove("hidden");
      nextBtn.classList.remove("hidden");
      loadQuestion();
    }

    nextBtn.addEventListener("click", nextQuestion);
    loadQuestion();
  </script>
</section>












    <script>
      const plane = document.getElementById("plane");
      const observer = document.getElementById("observer");
      const viewLinePlane = document.getElementById("viewLinePlane");
      const anglePlaneText = document.getElementById("anglePlaneText");
      const horizontalSlider = document.getElementById("horizontalSlider");
      const verticalSlider = document.getElementById("verticalSlider");
      const horizontalValue = document.getElementById("horizontalValue");
      const verticalValue = document.getElementById("verticalValue");
      const formulaPlaneText = document.getElementById("formulaPlaneText");
      const anglePlaneResult = document.getElementById("anglePlaneResult");

      function updatePlaneSim() {
        const horizontal = parseFloat(horizontalSlider.value);
        const vertical = parseFloat(verticalSlider.value);

        horizontalValue.textContent = horizontal.toFixed(1);
        verticalValue.textContent = vertical.toFixed(1);

        // Posisi pesawat
        const planeX = 80 + horizontal;
        const planeY = 250 - vertical * 0.8;
        plane.setAttribute("transform", `translate(${planeX}, ${planeY})`);

        // Update garis pandang
        viewLinePlane.setAttribute("x2", planeX);
        viewLinePlane.setAttribute("y2", planeY);

        // Hitung sudut menggunakan cos
        const miring = Math.sqrt(horizontal ** 2 + vertical ** 2);
        const cosTheta = horizontal / miring;
        const rad = Math.acos(cosTheta);
        const deg = ((rad * 180) / Math.PI).toFixed(2);
        const cosVal = cosTheta.toFixed(3);

        // Update teks
        anglePlaneText.textContent = `θ = ${deg}°`;
        anglePlaneText.setAttribute("x", 100);
        anglePlaneText.setAttribute("y", 230);

        formulaPlaneText.innerHTML = `
      cos(θ) = <span class="text-sky-700 font-semibold dark:text-sky-300">${horizontal}</span> /
      <span class="text-sky-700 font-semibold dark:text-sky-300">${miring.toFixed(
        2
      )}</span> =
      <span class="text-rose-600 font-semibold">${cosVal}</span>
      → θ = <span class="font-bold text-sky-700 dark:text-sky-300">${deg}°</span>
    `;

        anglePlaneResult.textContent = `${deg}°`;
      }

      horizontalSlider.addEventListener("input", updatePlaneSim);
      verticalSlider.addEventListener("input", updatePlaneSim);
      updatePlaneSim();
    </script>
















    <script>
      const ship = document.getElementById("ship");
      const lighthouse = document.getElementById("lighthouse");
      const viewLine = document.getElementById("viewLine");
      const angleText = document.getElementById("angleText");
      const shipSlider = document.getElementById("shipSlider");
      const shipValue = document.getElementById("shipValue");
      const formulaText = document.getElementById("formulaText");
      const angleResult = document.getElementById("angleResult");

      function updateLighthouseSim() {
        const horizontal = parseFloat(shipSlider.value);
        const height = 100; // tinggi mercusuar tetap
        const baseX = 520; // posisi mercusuar tetap
        const baseY = 250;

        // Update posisi kapal
        const shipX = baseX - horizontal;
        ship.setAttribute("transform", `translate(${shipX}, ${baseY})`);

        // Update garis pandang
        viewLine.setAttribute("x1", shipX + 30);
        viewLine.setAttribute("x2", baseX);
        viewLine.setAttribute("y1", baseY);
        viewLine.setAttribute("y2", baseY - height);

        // Hitung sudut dengan sin
        const miring = Math.sqrt(horizontal ** 2 + height ** 2);
        const sinTheta = height / miring;
        const rad = Math.asin(sinTheta);
        const deg = ((rad * 180) / Math.PI).toFixed(2);
        const sinVal = sinTheta.toFixed(3);

        // Update teks
        shipValue.textContent = horizontal.toFixed(1);
        angleText.textContent = `θ = ${deg}°`;

        formulaText.innerHTML = `
          sin(θ) = <span class="text-sky-700 font-semibold dark:text-sky-300">${height}</span> /
          <span class="text-sky-700 font-semibold dark:text-sky-300">${miring.toFixed(2)}</span> =
          <span class="text-rose-600 font-semibold">${sinVal}</span>
          → θ = <span class="font-bold text-sky-700 dark:text-sky-300">${deg}°</span>
        `;

        angleResult.textContent = `${deg}°`;
      }

      shipSlider.addEventListener("input", updateLighthouseSim);
      updateLighthouseSim();
    </script>


    <!-- Script Dark Mode -->
    <script>
      const darkToggle = document.getElementById("darkToggle");
      const html = document.documentElement;

      // Atur tema awal
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        html.classList.add("dark");
        darkToggle.innerHTML = "<i class='bx bx-sun text-lg'></i>";
      } else {
        html.classList.remove("dark");
        darkToggle.innerHTML = "<i class='bx bx-moon text-lg'></i>";
      }

      // Saat tombol diklik
      darkToggle.addEventListener("click", () => {
        html.classList.toggle("dark");
        if (html.classList.contains("dark")) {
          localStorage.theme = "dark";
          darkToggle.innerHTML = "<i class='bx bx-sun text-lg'></i>";
        } else {
          localStorage.theme = "light";
          darkToggle.innerHTML = "<i class='bx bx-moon text-lg'></i>";
        }
      });
    </script>




  </body>
</html>
