<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Identitas Diri - Modern UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .active-step {
      background-color: #3b82f6;
      color: white;
      box-shadow: 0 0 10px #3b82f6;
    }
    .form-section {
      animation: fade 0.5s ease;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

  <!-- Header -->
  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white mb-2 tracking-wide">Formulir Identitas Diri</h1>
    <p class="text-gray-300 text-sm">Desain Antarmuka Modern & Interaktif</p>
  </header>

  <!-- Progress Indicator -->
  <div class="flex justify-center gap-3 mb-8">
    <div class="step w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-sm font-semibold" data-step="0">1</div>
    <div class="step w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-sm font-semibold" data-step="1">2</div>
    <div class="step w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-sm font-semibold" data-step="2">3</div>
    <div class="step w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-sm font-semibold" data-step="3">4</div>
  </div>

  <!-- Container -->
  <div class="glass rounded-2xl shadow-2xl w-full max-w-3xl p-8 text-gray-100 transition-all duration-300">

    <!-- Breadcrumb -->
    <div class="mb-6 text-sm text-gray-400">Beranda > <span id="breadcrumb-section" class="text-blue-400">Data Pribadi</span></div>

    <!-- Sections -->
    <div id="form-container">
      <!-- Data Pribadi -->
      <section id="data-pribadi" class="form-section">
        <h2 class="text-xl font-semibold mb-4 text-blue-400">Data Pribadi</h2>
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block mb-1 text-sm">Nama Lengkap</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama lengkap">
          </div>
          <div>
            <label class="block mb-1 text-sm">Tempat, Tanggal Lahir</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Jakarta, 12 Mei 2000">
          </div>
          <div>
            <label class="block mb-1 text-sm">Jenis Kelamin</label>
            <select class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500">
              <option>Pilih Jenis Kelamin</option>
              <option>Laki-laki</option>
              <option>Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block mb-1 text-sm">Nomor Telepon / Email</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="08123456789 / email@domain.com">
          </div>
          <div class="md:col-span-2">
            <label class="block mb-1 text-sm">Alamat</label>
            <textarea class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
          </div>
        </form>
      </section>

      <!-- Pendidikan -->
      <section id="pendidikan" class="form-section hidden">
        <h2 class="text-xl font-semibold mb-4 text-blue-400">Pendidikan</h2>
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block mb-1 text-sm">Pendidikan Terakhir</label>
            <select class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500">
              <option>Pilih Pendidikan Terakhir</option>
              <option>SMA/SMK</option>
              <option>D3</option>
              <option>S1</option>
              <option>S2</option>
            </select>
          </div>
          <div>
            <label class="block mb-1 text-sm">Nama Institusi</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama institusi">
          </div>
          <div>
            <label class="block mb-1 text-sm">Jurusan / Program Studi</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Masukkan jurusan atau program studi">
          </div>
          <div>
            <label class="block mb-1 text-sm">Tahun Masuk – Lulus</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="2019 – 2023">
          </div>
        </form>
      </section>

      <!-- Organisasi -->
      <section id="organisasi" class="form-section hidden">
        <h2 class="text-xl font-semibold mb-4 text-blue-400">Pengalaman Organisasi</h2>
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block mb-1 text-sm">Nama Organisasi</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Nama organisasi">
          </div>
          <div>
            <label class="block mb-1 text-sm">Jabatan</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Jabatan Anda">
          </div>
          <div>
            <label class="block mb-1 text-sm">Periode Keanggotaan</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Contoh: 2020 – 2022">
          </div>
          <div class="md:col-span-2">
            <label class="block mb-1 text-sm">Uraian Tugas</label>
            <textarea class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Deskripsikan tugas Anda"></textarea>
          </div>
        </form>
      </section>

      <!-- Kerja -->
      <section id="kerja" class="form-section hidden">
        <h2 class="text-xl font-semibold mb-4 text-blue-400">Pengalaman Kerja</h2>
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block mb-1 text-sm">Nama Perusahaan</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama perusahaan">
          </div>
          <div>
            <label class="block mb-1 text-sm">Posisi / Jabatan</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="Posisi atau jabatan Anda">
          </div>
          <div>
            <label class="block mb-1 text-sm">Tahun Bekerja</label>
            <input type="text" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" placeholder="2021 – 2024">
          </div>
          <div class="md:col-span-2">
            <label class="block mb-1 text-sm">Deskripsi Pekerjaan</label>
            <textarea class="w-full p-3 rounded-lg bg-gray-800 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Tuliskan deskripsi pekerjaan Anda"></textarea>
          </div>
        </form>
      </section>
    </div>

    <!-- Navigation Buttons -->
    <div class="mt-8 flex justify-between">
      <button id="btn-back" class="px-5 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition">Kembali</button>
      <button id="btn-next" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition">Berikutnya</button>
    </div>
  </div>

  <script>
    const sections = document.querySelectorAll(".form-section");
    const steps = document.querySelectorAll(".step");
    const breadcrumb = document.getElementById("breadcrumb-section");
    const order = ["data-pribadi", "pendidikan", "organisasi", "kerja"];
    let current = 0;

    function showSection(index) {
      sections.forEach(s => s.classList.add("hidden"));
      document.getElementById(order[index]).classList.remove("hidden");
      breadcrumb.textContent = order[index].replace("-", " ").replace(/\b\w/g, c => c.toUpperCase());
      steps.forEach((st, i) => {
        st.classList.remove("active-step");
        if (i === index) st.classList.add("active-step");
      });
    }

    document.getElementById("btn-next").onclick = () => {
      if (current < order.length - 1) current++;
      showSection(current);
    };

    document.getElementById("btn-back").onclick = () => {
      if (current > 0) current--;
      showSection(current);
    };

    steps.forEach(step => {
      step.addEventListener("click", () => {
        current = parseInt(step.dataset.step);
        showSection(current);
      });
    });

    showSection(0);
  </script>
</body>
</html>
